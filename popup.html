<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Live Translator 设置</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <img src="icons/icon48.png" style="width: 24px; height: 24px; border-radius: 6px;" alt="Logo" />
      <h1 class="brand-title">Gemini Live Translator</h1>
    </div>
    <div class="brand-badge" id="versionBadge">Release v1.1.0</div>
  </header>

  <main class="popup-content">
    <!-- Preset Endpoint Switcher -->
    <div class="preset-group">
      <button type="button" class="preset-btn active" id="btnPresetOfficial">
        <svg class="ui-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3.6 9h16.8M3.6 15h16.8"></path><path d="M12 3a14.5 14.5 0 0 0 0 18 14.5 14.5 0 0 0 0-18"></path></svg>
        <span>Google 官方 API</span>
      </button>
      <button type="button" class="preset-btn" id="btnPresetCustom">
        <svg class="ui-icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        <span>自定义代理 / 节点</span>
      </button>
    </div>

    <!-- API Host Input -->
    <div class="form-group">
      <div class="label-row">
        <label class="form-label" for="apiHost">API 节点地址 (Host / Endpoint)</label>
        <span class="host-type-badge" id="hostTypeBadge">Google 官方</span>
      </div>
      <input type="text" id="apiHost" class="form-input" spellcheck="false" autocomplete="off" placeholder="https://generativelanguage.googleapis.com" value="https://generativelanguage.googleapis.com">
      <div class="form-hint" id="hostHint">官方 WebSocket: wss://generativelanguage.googleapis.com</div>
    </div>

    <!-- API Key Input -->
    <div class="form-group">
      <div class="label-row">
        <label class="form-label" for="apiKey">API Key</label>
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer" class="link-get-key">
          <span>获取免费 Key</span>
          <svg class="ui-icon-xs" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
      </div>
      <div class="input-password-wrapper">
        <input type="password" id="apiKey" class="form-input" spellcheck="false" autocomplete="off" placeholder="AIzaSy... (直连官方必填，免密代理可留空)">
        <button type="button" class="btn-toggle-pwd" id="btnTogglePwd" title="显示/隐藏 Key" aria-label="显示 API Key" aria-pressed="false">
          <svg class="ui-icon" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <div class="form-hint">官方 API 必须填写 Key；使用免密中继/自建代理时可留空。</div>
    </div>

    <!-- Model Select -->
    <div class="form-group">
      <label class="form-label" id="labelModelSelect" for="modelSelect">同传模型 (Model)</label>
      <select id="modelSelect" class="form-select">
        <option value="models/gemini-3.5-live-translate-preview" selected>models/gemini-3.5-live-translate-preview (推荐)</option>
        <option value="custom">自定义模型名称...</option>
      </select>
      <input type="text" id="customModelInput" class="form-input" spellcheck="false" style="display: none; margin-top: 6px;" placeholder="例如: models/gemini-3.5-live-translate-preview" aria-label="自定义模型名称">
      <div class="form-hint hint-with-icon" id="modelHint">
        <svg class="ui-icon-xs hint-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        <span>原生同传模型（gemini-3.5-live-translate-preview）：低延迟、连续流式双语同传。</span>
      </div>
    </div>

    <!-- Connection Self-Test -->
    <div class="form-group">
      <button type="button" id="btnTestConn" class="preset-btn" style="width: 100%;">
        <svg class="ui-icon" viewBox="0 0 24 24"><path d="M12 22v-5"></path><path d="M9 8V2"></path><path d="M15 8V2"></path><path d="M18 8v5a6 6 0 0 1-12 0V8z"></path></svg>
        <span>测试节点连接（不消耗字幕额度）</span>
      </button>
      <div class="form-hint test-result-row" id="testResult" aria-live="polite" role="status">
        <span>点击后向当前节点发起一次 WebSocket 握手自检。</span>
      </div>
    </div>

    <!-- Language Selectors -->
    <div class="form-row">
      <div class="form-group half">
        <label class="form-label" id="labelSourceLang" for="sourceLang">默认识别源语言</label>
        <select id="sourceLang" class="form-select">
          <option value="自动识别 (Auto Detect)" selected>自动识别 (推荐)</option>
          <option value="日语 (Japanese)">日语 (Japanese)</option>
          <option value="英语 (English)">英语 (English)</option>
          <option value="韩语 (Korean)">韩语 (Korean)</option>
          <option value="中文 (Chinese)">中文 (Chinese)</option>
        </select>
      </div>

      <div class="form-group half">
        <label class="form-label" id="labelTargetLang" for="targetLang">默认目标语言</label>
        <select id="targetLang" class="form-select">
          <option value="中文普通话 (Chinese)" selected>中文普通话</option>
          <option value="繁体中文 (Traditional Chinese)">繁体中文</option>
          <option value="英语 (English)">英语 (English)</option>
          <option value="日语 (Japanese)">日语 (日本語)</option>
          <option value="韩语 (Korean)">韩语 (한국어)</option>
          <option value="法语 (French)">法语 (Français)</option>
          <option value="德语 (German)">德语 (Deutsch)</option>
          <option value="西班牙语 (Spanish)">西班牙语 (Español)</option>
          <option value="俄语 (Russian)">俄语 (Русский)</option>
        </select>
      </div>
    </div>

    <!-- UI Sliders -->
    <div class="form-group">
      <div class="label-row">
        <label class="form-label" for="opacity">窗口不透明度 (<span id="opacityVal">65</span>%)</label>
      </div>
      <input type="range" id="opacity" min="10" max="100" value="65" class="form-range">
    </div>

    <div class="form-group">
      <div class="label-row">
        <label class="form-label" for="blur">背景毛玻璃模糊度 (<span id="blurVal">3</span>px)</label>
      </div>
      <input type="range" id="blur" min="0" max="20" value="3" class="form-range">
    </div>

    <div class="form-group">
      <div class="label-row">
        <label class="form-label" for="fontSize">译文字号 (<span id="fontSizeVal">17</span>px)</label>
      </div>
      <input type="range" id="fontSize" min="12" max="30" value="17" class="form-range">
    </div>

    <div class="tab-status-banner info" id="tabStatusBanner" role="status" aria-live="polite" style="display: none;">
      <span class="tab-status-icon" id="tabStatusIcon"></span>
      <span class="tab-status-text" id="tabStatusText"></span>
    </div>

    <button type="button" id="btnSave" class="btn-save">
      <svg class="ui-icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      <span>保存并应用设置</span>
    </button>
  </main>

  <footer class="popup-footer">
    <svg class="ui-icon-xs footer-tip-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
    <span>提示：在网页悬浮窗顶部点击
      <svg class="ui-icon-inline" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      图标，可直接在视频画面上实时调整透明度、字号与显示模式。</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
